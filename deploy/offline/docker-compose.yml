# ============================================================
# docker-compose.yml · 私有化交付版（$APP_DIR 部署目录）
# 与生产云端版（deploy/docker-compose.server.yml）同源，差异：
#   ① llm-api 使用预构建镜像 mra/llm-api（离线 tar 导入；云端为 python
#      基镜像+卷挂载代码），叠加 ffmpeg 与可选本地 ASR 依赖
#   ② 端口改为变量（.llm_env 的 MRA_STATIC_PORT/MRA_API_PORT，默认同云端）
#   ③ 资源限幅变量化（本地 whisper 引擎时调大，见 llm_env.template）
#   ④ MySQL 为可选 profile（--profile mysql 启用容器化 MySQL；对接院内
#      已有实例时不启用，MRA_MYSQL_HOST 指向该实例）
# 变更流程：改本文件 → 服务器同路径更新 → docker compose up -d
# ============================================================
services:
  medical-record-agent:
    image: public.ecr.aws/nginx/nginx:1.27-alpine
    container_name: medical-record-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MRA_STATIC_PORT:-3904}:8080"
    volumes:
      - ./repo/demo:/www:ro
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 96m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "3" }
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3

  llm-api:
    image: mra/llm-api:${MRA_VERSION:-v1.0}
    container_name: mra-llm-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${MRA_API_PORT:-3905}:8090"
    volumes:
      - ./repo/server:/app:ro
      - ./repo/mcp-server:/mcp-server:ro
      - ./repo/demo/data:/data:ro
      - ./.llm_env:/.llm_env:ro
      # 方案B：本地 whisper 模型目录挂载（ASR_LOCAL_MODEL 指向 /models/<名>）
      - ./models:/models:ro
    environment:
      - MRA_DATA_PATH=/data/patients.json
      - MRA_LLM_PORT=8090
    env_file:
      - ./.llm_env
    working_dir: /app
    command: python3 llm_api.py
    mem_limit: ${MRA_API_MEM_LIMIT:-512m}
    cpus: ${MRA_API_CPUS:-1.0}
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 可选：容器化 MySQL（默认不启用）。对接院内已有实例时无需此服务——
  # .llm_env 的 MRA_MYSQL_HOST 指向该实例即可（说明书 §5.4）
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.0
    container_name: mra-mysql
    restart: unless-stopped
    profiles: ["mysql"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?需在 .llm_env 设置}
      - MYSQL_DATABASE=${MRA_MYSQL_DB:-medical_record_agent}
      - MYSQL_USER=${MRA_MYSQL_USER:-mra}
      - MYSQL_PASSWORD=${MRA_MYSQL_PASSWORD:?需在 .llm_env 设置}
    volumes:
      - mysql-data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "3" }
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
