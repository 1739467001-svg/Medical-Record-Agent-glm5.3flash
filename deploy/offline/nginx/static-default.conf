# ============================================================
# 静态容器配置 · 挂载为 $APP_DIR/conf/default.conf
# （docker-compose.yml 卷：./conf/default.conf:/etc/nginx/conf.d/default.conf:ro）
# 容器端口 8080，根目录 /www（卷挂载 ./repo/demo:/www:ro）
# ============================================================
server {
    listen 8080;
    server_name _;
    root /www;
    index index.html;

    # 静态资源缓存（js/css 一周；演示数据 data/ 不缓存，保证更新即达）
    location ~* \.(js|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
